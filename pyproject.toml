[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcraft"
version = "0.1.0"
description = "Local read-only AI commit message suggestions powered by Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CommitCraft Contributors"}]
dependencies = ["requests>=2.31.0"]
keywords = ["git", "commit", "ollama", "cli", "conventional-commits"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
commitcraft = "commitcraft.cli:main"
make_commit = "commitcraft.cli:main"
make_commit_message = "commitcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["commitcraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
